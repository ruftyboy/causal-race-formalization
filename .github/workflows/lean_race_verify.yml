name: Lean RACE verification

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lean-race-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            lake-manifest.json
          key: lean-race-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          save-always: true
      - name: Install Lean via elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          lake update
      - name: Fetch mathlib compiled cache
        shell: bash
        run: |
          lake exe cache get
      - name: Build and kernel-check Lean proof
        shell: bash
        run: |
          lake build
      - name: Audit for unfinished proof placeholders
        shell: bash
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom)\b' RACEFormal RACEFormal.lean --include='*.lean'; then
            echo 'Unfinished proof placeholder found.'
            exit 1
          fi
          echo 'No sorry/admit/axiom placeholders found.'
